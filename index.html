<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <h3>Nama : Muhammad Rio Aprilianto</h3>
    <h3>NIM : 20240140204</h3>

    <div style="margin-bottom: 20px;">
        <input type="text" id="inputKota" placeholder="Masukkan nama kota...">
        <button id="btnCari">Cari Lokasi</button>
    </div>

    Lokasi : <p id="lokasi"></p>
    Kota : <p id="kota"></p>
    Tipe : <p id="tipe"></p>
    Koordinat : <p id="coordinat"></p>

    <script>
        function cariData(){
            const kota = document.getElementById("inputKota").value;
            if(kota === ""){
                alert("Masukkan nama kota terlebih dahulu!");
                return;
            }
            
            const urlapi = "https://api.maptiler.com/geocoding/" + kota + ".json?key=4cMB0JsLdv6EmJDeuMGm";
            $.ajax({
                url : urlapi,
                method : "GET",
                success : function(data){
                    console.log(data);
                    const l = document.getElementById("lokasi");
                    const k = document.getElementById("kota");
                    const t = document.getElementById("tipe");
                    const c = document.getElementById("coordinat");
                    if(data.features.length > 0){
                        let lokasi = data.features[0].matching_place_name;
                        let kota = data.features[0].matching_text;
                        let tipe = data.features[0].type;
                        let coordinat = data.features[0].geometry.coordinates;
                        l.innerHTML = lokasi;
                        k.innerHTML = kota;
                        t.innerHTML = tipe;
                        c.innerHTML = coordinat;
                    } else {
                        alert("Data tidak ditemukan!");
                    }
                },
                error : function(error){
                console.log(error);
            }
        });    
        }
        document.getElementById("btnCari").addEventListener("click", cariData);
    </script>
</body>
</html>
